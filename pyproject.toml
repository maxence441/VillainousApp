[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-app"
version = "0.1.0"
description = "A minimal Python command-line application"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["Flask>=3.0,<4.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
python-app = "python_app.cli:main"
python-app-web = "python_app.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
python_app = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
