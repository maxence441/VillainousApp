<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#100d16">
    <meta name="description" content="{% block description %}Entrez dans l'univers de Villainous.{% endblock %}">
    <title>{% block title %}Villainous{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='villainous.css') }}">
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="{{ url_for('home.index') }}" aria-label="Villainous, accueil">
          <span class="brand-mark" aria-hidden="true">V</span>
          <span>VILLAINOUS</span>
        </a>
        <nav class="navigation" aria-label="Navigation principale">
          <a class="nav-button{% if request.blueprint == 'scores' %} nav-button-active{% endif %}" href="{{ url_for('scores.index') }}"{% if request.blueprint == 'scores' %} aria-current="page"{% endif %}>
            <span class="nav-icon" aria-hidden="true">♛</span>
            Scores
          </a>
          <a class="nav-button nav-button-primary{% if request.blueprint == 'characters' %} nav-button-active{% endif %}" href="{{ url_for('characters.index') }}"{% if request.blueprint == 'characters' %} aria-current="page"{% endif %}>
            <span class="nav-icon" aria-hidden="true">✦</span>
            Personnages
          </a>
        </nav>
      </header>
      <main>
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
